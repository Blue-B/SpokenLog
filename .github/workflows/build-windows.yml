name: Build SpokenLog

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: spokenlog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Release v0.1.0-beta.1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.1.0-beta.1 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete v0.1.0-beta.1 --repo "${{ github.repository }}" --yes --cleanup-tag
          fi
          gh release create v0.1.0-beta.1 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "SpokenLog v0.1.0-beta.1" \
            --draft \
            --prerelease \
            --notes "First beta build of SpokenLog.

          Downloads:
          - Windows x64: download SpokenLog-Windows-x64.zip, extract it, and run SpokenLog.exe.
          - Android: download SpokenLog-Android.apk and install it manually.

          This beta focuses on Windows and Android. macOS and iOS are not included yet because they have not completed native build/device validation.

          Highlights:
          - Local-first recording library
          - Local or cloud transcription
          - Local speaker diarization
          - Editable transcripts and speaker names
          - Batch transcription
          - Screen-off Android recording support
          - Interrupted recording recovery"

  build-windows:
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Preserve app source
        shell: pwsh
        run: |
          Copy-Item lib "$env:RUNNER_TEMP\spokenlog_lib" -Recurse
          Copy-Item pubspec.yaml "$env:RUNNER_TEMP\spokenlog_pubspec.yaml"
          Copy-Item analysis_options.yaml "$env:RUNNER_TEMP\spokenlog_analysis.yaml"
          if (Test-Path assets) { Copy-Item assets "$env:RUNNER_TEMP\spokenlog_assets" -Recurse }
          if (Test-Path test) { Copy-Item test "$env:RUNNER_TEMP\spokenlog_test" -Recurse }

      - name: Create platform runners
        run: flutter create . --platforms=windows,android --project-name voice_transcriber

      - name: Prepare Windows runner
        shell: pwsh
        run: |
          $cmakePath = "windows/CMakeLists.txt"
          $cmake = Get-Content $cmakePath -Raw
          $cmake = $cmake -replace 'cmake_minimum_required\(VERSION 3\.14\)', 'cmake_minimum_required(VERSION 3.15)'
          $cmake = $cmake -replace 'cmake_policy\(VERSION 3\.14\.\.\.3\.25\)', 'cmake_policy(VERSION 3.15...3.25)'
          $cmake = $cmake -replace 'set\(BINARY_NAME "voice_transcriber"\)', 'set(BINARY_NAME "SpokenLog")'
          Set-Content -Path $cmakePath -Value $cmake -NoNewline

          $mainPath = "windows/runner/main.cpp"
          $main = Get-Content $mainPath -Raw
          $main = $main -replace 'L"voice_transcriber"', 'L"SpokenLog"'
          Set-Content -Path $mainPath -Value $main -NoNewline

      - name: Restore app source
        shell: pwsh
        run: |
          Remove-Item lib -Recurse -Force
          Copy-Item "$env:RUNNER_TEMP\spokenlog_lib" lib -Recurse
          Copy-Item "$env:RUNNER_TEMP\spokenlog_pubspec.yaml" pubspec.yaml -Force
          Copy-Item "$env:RUNNER_TEMP\spokenlog_analysis.yaml" analysis_options.yaml -Force
          if (Test-Path "$env:RUNNER_TEMP\spokenlog_assets") {
            if (Test-Path assets) { Remove-Item assets -Recurse -Force }
            Copy-Item "$env:RUNNER_TEMP\spokenlog_assets" assets -Recurse
          }
          if (Test-Path test) { Remove-Item test -Recurse -Force }
          if (Test-Path "$env:RUNNER_TEMP\spokenlog_test") {
            Copy-Item "$env:RUNNER_TEMP\spokenlog_test" test -Recurse
          }

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        if: github.event_name == 'push' && github.event.head_commit.message == 'Release v0.1.0-beta.1'
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "SpokenLog-Windows-x64.zip" -CompressionLevel Optimal

      - name: Upload Windows release asset
        if: github.event_name == 'push' && github.event.head_commit.message == 'Release v0.1.0-beta.1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload v0.1.0-beta.1 "SpokenLog-Windows-x64.zip" --repo "${{ github.repository }}" --clobber

  build-android:
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preserve app source
        run: |
          cp -R lib "$RUNNER_TEMP/spokenlog_lib"
          cp pubspec.yaml "$RUNNER_TEMP/spokenlog_pubspec.yaml"
          cp analysis_options.yaml "$RUNNER_TEMP/spokenlog_analysis.yaml"
          if [ -d assets ]; then cp -R assets "$RUNNER_TEMP/spokenlog_assets"; fi
          if [ -d test ]; then cp -R test "$RUNNER_TEMP/spokenlog_test"; fi

      - name: Create Android runner
        run: flutter create . --platforms=android --project-name voice_transcriber

      - name: Restore app source
        run: |
          rm -rf lib
          cp -R "$RUNNER_TEMP/spokenlog_lib" lib
          cp "$RUNNER_TEMP/spokenlog_pubspec.yaml" pubspec.yaml
          cp "$RUNNER_TEMP/spokenlog_analysis.yaml" analysis_options.yaml
          if [ -d "$RUNNER_TEMP/spokenlog_assets" ]; then rm -rf assets; cp -R "$RUNNER_TEMP/spokenlog_assets" assets; fi
          if [ -d "$RUNNER_TEMP/spokenlog_test" ]; then rm -rf test; cp -R "$RUNNER_TEMP/spokenlog_test" test; fi

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Package Android release
        if: github.event_name == 'push' && github.event.head_commit.message == 'Release v0.1.0-beta.1'
        run: cp build/app/outputs/flutter-apk/app-release.apk SpokenLog-Android.apk

      - name: Upload Android release asset
        if: github.event_name == 'push' && github.event.head_commit.message == 'Release v0.1.0-beta.1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0-beta.1 SpokenLog-Android.apk --repo "${{ github.repository }}" --clobber


  finalize-release:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Release v0.1.0-beta.1'
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets for checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0-beta.1 --repo "${{ github.repository }}" --pattern "SpokenLog-*"
          sha256sum SpokenLog-Windows-x64.zip SpokenLog-Android.apk > SHA256SUMS.txt
          gh release upload v0.1.0-beta.1 SHA256SUMS.txt --repo "${{ github.repository }}" --clobber

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_id=$(gh release view v0.1.0-beta.1 --repo "${{ github.repository }}" --json databaseId --jq .databaseId)
          gh api --method PATCH "repos/${{ github.repository }}/releases/$release_id" -F draft=false -F prerelease=true >/dev/null
