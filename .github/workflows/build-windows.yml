name: Build SpokenLog

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spokenlog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Windows runner without replacing app source
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          flutter create . --no-pub --empty --platforms=windows \
            --project-name spokenlog --org io.github.blueb
          git restore -- pubspec.lock
          flutter pub get --enforce-lockfile
      - name: Apply Windows branding
        shell: pwsh
        run: |
          $path = 'windows/CMakeLists.txt'
          $text = Get-Content $path -Raw
          $text = $text -replace `
            'cmake_minimum_required\(VERSION 3\.14\)', `
            'cmake_minimum_required(VERSION 3.15)'
          $text = $text -replace `
            'cmake_policy\(VERSION 3\.14\.\.\.3\.25\)', `
            'cmake_policy(VERSION 3.15...3.25)'
          $text = $text -replace `
            'set\(BINARY_NAME "spokenlog"\)', 'set(BINARY_NAME "SpokenLog")'
          Set-Content $path $text -NoNewline
          $path = 'windows/runner/main.cpp'
          $text = (Get-Content $path -Raw) -replace `
            'L"spokenlog"', 'L"SpokenLog"'
          Set-Content $path $text -NoNewline
      - run: dart run flutter_launcher_icons
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build windows --release
      - name: Package Windows
        shell: pwsh
        run: |
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' `
            -DestinationPath 'SpokenLog-Windows-x64.zip' `
            -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: SpokenLog-Windows
          path: SpokenLog-Windows-x64.zip
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android runner without replacing app source
        run: |
          flutter create . --no-pub --empty --platforms=android \
            --project-name spokenlog --org io.github.blueb
          git restore -- pubspec.lock
          flutter pub get --enforce-lockfile
      - name: Verify launcher identity before building
        run: |
          test -f \
            android/app/src/main/kotlin/io/github/blueb/spokenlog/MainActivity.kt
          grep -q '^package io.github.blueb.spokenlog$' \
            android/app/src/main/kotlin/io/github/blueb/spokenlog/MainActivity.kt
          grep -q 'namespace = "io.github.blueb.spokenlog"' \
            android/app/build.gradle.kts
          grep -q 'applicationId = "io.github.blueb.spokenlog"' \
            android/app/build.gradle.kts
          grep -q 'android:name=".MainActivity"' \
            android/app/src/main/AndroidManifest.xml
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - name: Verify APK metadata and signature
        run: |
          TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$TOOLS/aapt" dump badging "$APK" | \
            grep "package: name='io.github.blueb.spokenlog'"
          "$TOOLS/aapt" dump badging "$APK" | \
            grep \
            "launchable-activity: name='io.github.blueb.spokenlog.MainActivity'"
          "$TOOLS/apksigner" verify "$APK"
          cp "$APK" SpokenLog-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SpokenLog-Android
          path: SpokenLog-Android.apk
          if-no-files-found: error
