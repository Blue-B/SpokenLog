name: voice_transcriber
publish_to: 'none'
description: SpokenLog - local-first cross-platform recorder and transcription workspace.
version: 0.1.0+3

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  record: ^7.1.1
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0
  flutter_foreground_task: ^11.0.3
  http: ^1.6.0
  audioplayers: ^6.8.1
  sherpa_onnx: ^1.13.8
  file_picker: ^13.1.0
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/spokenlog_icon.png

flutter_launcher_icons:
  image_path: assets/spokenlog_icon.png
  android: true
  windows:
    generate: true
    image_path: assets/spokenlog_icon.png
    icon_size: 48
