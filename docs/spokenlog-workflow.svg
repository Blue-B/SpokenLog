<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SpokenLog transcription workflow</title>
  <desc id="desc">Import or record, choose local or cloud transcription, add local speaker labels, then export.</desc>
  <rect width="1200" height="420" rx="28" fill="#0d1117"/>
  <text x="56" y="70" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="34" font-weight="700">SpokenLog</text>
  <text x="56" y="102" fill="#8b949e" font-family="Arial, sans-serif" font-size="18">Record anywhere. Transcribe your way.</text>

  <g font-family="Arial, sans-serif">
    <rect x="56" y="150" width="235" height="190" rx="18" fill="#161b22" stroke="#30363d"/>
    <circle cx="92" cy="190" r="20" fill="#2f81f7"/>
    <text x="86" y="197" fill="#ffffff" font-size="20" font-weight="700">1</text>
    <text x="122" y="196" fill="#f0f6fc" font-size="20" font-weight="700">Record or drop</text>
    <text x="80" y="235" fill="#8b949e" font-size="15">WAV · M4A · MP3</text>
    <text x="80" y="260" fill="#8b949e" font-size="15">MP4 · WebM</text>
    <rect x="80" y="288" width="162" height="32" rx="16" fill="#21262d"/>
    <text x="103" y="309" fill="#c9d1d9" font-size="13">drag &amp; drop / picker</text>

    <path d="M305 245 H332" stroke="#484f58" stroke-width="3" stroke-linecap="round"/>
    <path d="M326 237 L336 245 L326 253" fill="none" stroke="#484f58" stroke-width="3"/>

    <rect x="347" y="150" width="235" height="190" rx="18" fill="#161b22" stroke="#30363d"/>
    <circle cx="383" cy="190" r="20" fill="#8957e5"/>
    <text x="377" y="197" fill="#ffffff" font-size="20" font-weight="700">2</text>
    <text x="413" y="196" fill="#f0f6fc" font-size="20" font-weight="700">Local ↔ Cloud</text>
    <rect x="371" y="226" width="82" height="34" rx="17" fill="#238636"/>
    <text x="391" y="248" fill="#ffffff" font-size="14" font-weight="700">Local</text>
    <rect x="461" y="226" width="94" height="34" rx="17" fill="#1f6feb"/>
    <text x="480" y="248" fill="#ffffff" font-size="14" font-weight="700">Cloud</text>
    <text x="371" y="289" fill="#8b949e" font-size="14">SenseVoice · Moonshine</text>
    <text x="371" y="313" fill="#8b949e" font-size="14">Whisper · Groq · Cloudflare</text>

    <path d="M596 245 H623" stroke="#484f58" stroke-width="3" stroke-linecap="round"/>
    <path d="M617 237 L627 245 L617 253" fill="none" stroke="#484f58" stroke-width="3"/>

    <rect x="638" y="150" width="235" height="190" rx="18" fill="#161b22" stroke="#30363d"/>
    <circle cx="674" cy="190" r="20" fill="#d29922"/>
    <text x="668" y="197" fill="#ffffff" font-size="20" font-weight="700">3</text>
    <text x="704" y="196" fill="#f0f6fc" font-size="20" font-weight="700">Speaker-aware</text>
    <text x="662" y="238" fill="#79c0ff" font-size="14" font-weight="700">00:04  Speaker 1</text>
    <text x="662" y="261" fill="#c9d1d9" font-size="14">Can everyone hear me?</text>
    <text x="662" y="293" fill="#d2a8ff" font-size="14" font-weight="700">00:08  Speaker 2</text>
    <text x="662" y="316" fill="#c9d1d9" font-size="14">Yep, let's start.</text>

    <path d="M887 245 H914" stroke="#484f58" stroke-width="3" stroke-linecap="round"/>
    <path d="M908 237 L918 245 L908 253" fill="none" stroke="#484f58" stroke-width="3"/>

    <rect x="929" y="150" width="215" height="190" rx="18" fill="#161b22" stroke="#30363d"/>
    <circle cx="965" cy="190" r="20" fill="#3fb950"/>
    <text x="959" y="197" fill="#ffffff" font-size="20" font-weight="700">4</text>
    <text x="995" y="196" fill="#f0f6fc" font-size="20" font-weight="700">Export</text>
    <rect x="953" y="226" width="70" height="34" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="975" y="248" fill="#f0f6fc" font-size="13" font-weight="700">TXT</text>
    <rect x="1031" y="226" width="70" height="34" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="1053" y="248" fill="#f0f6fc" font-size="13" font-weight="700">SRT</text>
    <rect x="953" y="270" width="70" height="34" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="975" y="292" fill="#f0f6fc" font-size="13" font-weight="700">VTT</text>
    <rect x="1031" y="270" width="70" height="34" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="1046" y="292" fill="#f0f6fc" font-size="13" font-weight="700">JSON</text>
  </g>

  <text x="56" y="385" fill="#6e7681" font-family="Arial, sans-serif" font-size="14">Local-first · Cloud-optional · Provider-independent local diarization</text>
</svg>
