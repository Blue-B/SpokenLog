<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="666" viewBox="0 0 1000 666" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>SpokenLog speech models compared on Korean speech</title>
<rect width="1000" height="666" rx="18" fill="#FBF7F4"/>
<text x="36" y="52" font-size="24" font-weight="700" fill="#2B2420">Speech models compared · Korean</text>
<text x="36" y="80" font-size="13.5" fill="#6E625B">Measured in SpokenLog: 10 Korean sentences (67 s, synthetic voice) on a 10-core PC. Shorter bars are better.</text>
<g font-size="12.5" font-weight="700" fill="#8A7D75">
<text x="36" y="128">MODEL · WHERE IT RUNS</text>
<text x="410" y="128">WRONG CHARACTERS PER 100</text>
<text x="720" y="128">SECONDS PER 1 MIN OF AUDIO (PC)</text>
</g>
<rect x="20" y="150" width="960" height="60" rx="10" fill="#FFFFFF"/>
<text x="36" y="176" font-size="16" font-weight="700" fill="#2B2420">Whisper Turbo</text>
<rect x="163" y="160" width="98" height="22" rx="11" fill="#C4501A"/>
<text x="212.0" y="175.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Best on PC</text>
<rect x="36" y="185" width="66.4" height="19" rx="9.5" fill="none" stroke="#D8CCC4"/>
<text x="69.2" y="198.5" font-size="11.5" fill="#6E625B" text-anchor="middle">Windows</text>
<rect x="108.4" y="185" width="52.0" height="19" rx="9.5" fill="none" stroke="#D8CCC4"/>
<text x="134.4" y="198.5" font-size="11.5" fill="#6E625B" text-anchor="middle">macOS</text>
<rect x="410" y="168" width="20.8" height="22" rx="6" fill="#C4501A"/>
<text x="438.8" y="184" font-size="14" font-weight="700" fill="#2B2420">0.8</text>
<rect x="720" y="168" width="139.2" height="22" rx="6" fill="#C4501A" opacity="0.55"/>
<text x="867.2" y="184" font-size="14" font-weight="700" fill="#2B2420">17 s</text>
<text x="36" y="242" font-size="16" font-weight="700" fill="#2B2420">Groq · Whisper Large V3</text>
<rect x="36" y="251" width="95.2" height="19" rx="9.5" fill="none" stroke="#D8CCC4"/>
<text x="83.6" y="264.5" font-size="11.5" fill="#6E625B" text-anchor="middle">All devices</text>
<rect x="137.2" y="251" width="52.0" height="19" rx="9.5" fill="none" stroke="#D8CCC4"/>
<text x="163.2" y="264.5" font-size="11.5" fill="#6E625B" text-anchor="middle">Cloud</text>
<rect x="410" y="234" width="20.8" height="22" rx="6" fill="#5B6B7F"/>
<text x="438.8" y="250" font-size="14" font-weight="700" fill="#2B2420">0.8*</text>
<text x="720" y="250" font-size="13" fill="#6E625B">depends on the connection</text>
<rect x="20" y="282" width="960" height="60" rx="10" fill="#FFFFFF"/>
<text x="36" y="308" font-size="16" font-weight="700" fill="#2B2420">Whisper Small</text>
<rect x="36" y="317" width="52.0" height="19" rx="9.5" fill="none" stroke="#D8CCC4"/>
<text x="62.0" y="330.5" font-size="11.5" fill="#6E625B" text-anchor="middle">Phone</text>
<rect x="94.0" y="317" width="30.4" height="19" rx="9.5" fill="none" stroke="#D8CCC4"/>
<text x="109.2" y="330.5" font-size="11.5" fill="#6E625B" text-anchor="middle">PC</text>
<rect x="410" y="300" width="52.0" height="22" rx="6" fill="#EE6C2B"/>
<text x="470.0" y="316" font-size="14" font-weight="700" fill="#2B2420">2.0</text>
<rect x="720" y="300" width="210.4" height="22" rx="6" fill="#EE6C2B" opacity="0.55"/>
<text x="938.4" y="316" font-size="14" font-weight="700" fill="#2B2420">26 s</text>
<text x="36" y="374" font-size="16" font-weight="700" fill="#2B2420">SenseVoice</text>
<rect x="137" y="358" width="130" height="22" rx="11" fill="#EE6C2B"/>
<text x="202.0" y="373.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Best on phones</text>
<rect x="36" y="383" width="52.0" height="19" rx="9.5" fill="none" stroke="#D8CCC4"/>
<text x="62.0" y="396.5" font-size="11.5" fill="#6E625B" text-anchor="middle">Phone</text>
<rect x="94.0" y="383" width="30.4" height="19" rx="9.5" fill="none" stroke="#D8CCC4"/>
<text x="109.2" y="396.5" font-size="11.5" fill="#6E625B" text-anchor="middle">PC</text>
<rect x="410" y="366" width="83.2" height="22" rx="6" fill="#EE6C2B"/>
<text x="501.2" y="382" font-size="14" font-weight="700" fill="#2B2420">3.2</text>
<rect x="720" y="366" width="47.2" height="22" rx="6" fill="#EE6C2B" opacity="0.55"/>
<text x="775.2" y="382" font-size="14" font-weight="700" fill="#2B2420">6 s</text>
<rect x="20" y="414" width="960" height="60" rx="10" fill="#FFFFFF"/>
<text x="36" y="440" font-size="16" font-weight="700" fill="#2B2420">Whisper Base</text>
<rect x="36" y="449" width="52.0" height="19" rx="9.5" fill="none" stroke="#D8CCC4"/>
<text x="62.0" y="462.5" font-size="11.5" fill="#6E625B" text-anchor="middle">Phone</text>
<rect x="94.0" y="449" width="30.4" height="19" rx="9.5" fill="none" stroke="#D8CCC4"/>
<text x="109.2" y="462.5" font-size="11.5" fill="#6E625B" text-anchor="middle">PC</text>
<rect x="410" y="432" width="208.0" height="22" rx="6" fill="#EE6C2B"/>
<text x="626.0" y="448" font-size="14" font-weight="700" fill="#2B2420">8.0</text>
<rect x="720" y="432" width="104.8" height="22" rx="6" fill="#EE6C2B" opacity="0.55"/>
<text x="832.8" y="448" font-size="14" font-weight="700" fill="#2B2420">13 s</text>
<text x="36" y="506" font-size="16" font-weight="700" fill="#2B2420">Whisper Tiny</text>
<rect x="36" y="515" width="52.0" height="19" rx="9.5" fill="none" stroke="#D8CCC4"/>
<text x="62.0" y="528.5" font-size="11.5" fill="#6E625B" text-anchor="middle">Phone</text>
<rect x="94.0" y="515" width="30.4" height="19" rx="9.5" fill="none" stroke="#D8CCC4"/>
<text x="109.2" y="528.5" font-size="11.5" fill="#6E625B" text-anchor="middle">PC</text>
<rect x="410" y="498" width="228.8" height="22" rx="6" fill="#EE6C2B"/>
<text x="646.8" y="514" font-size="14" font-weight="700" fill="#2B2420">8.8</text>
<rect x="720" y="498" width="59.2" height="22" rx="6" fill="#EE6C2B" opacity="0.55"/>
<text x="787.2" y="514" font-size="14" font-weight="700" fill="#2B2420">7 s</text>
<g font-size="12.5" fill="#6E625B">
<rect x="36" y="570" width="14" height="14" rx="4" fill="#EE6C2B"/>
<text x="56" y="582">On this device: phone and PC</text>
<rect x="280" y="570" width="14" height="14" rx="4" fill="#C4501A"/>
<text x="300" y="582">PC only (Windows, macOS)</text>
<rect x="496" y="570" width="14" height="14" rx="4" fill="#5B6B7F"/>
<text x="516" y="582">Online, your own key</text>
</g>
<text x="36" y="614" font-size="12" fill="#8A7D75">* Groq runs Whisper Large V3 on its servers; the figure is Large V3 measured on this PC (it took 144 s per minute here, so it is not offered on devices).</text>
<text x="36" y="634" font-size="12" fill="#8A7D75">Phones take several times longer than this PC. SenseVoice adds no punctuation. Real recordings with noise or several speakers score lower.</text>
</svg>
